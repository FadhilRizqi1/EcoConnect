name: ecoconnect
description: Aplikasi komunitas gaya hidup ramah lingkungan

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP — lightweight, no code gen required
  http: ^1.2.1

  # State Management
  provider: ^6.1.2
  shared_preferences: ^2.3.3

  # UI & Animations (Peak-End Rule: konfeti)
  confetti: ^0.7.0
  flutter_animate: ^4.5.0
  lottie: ^3.3.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # Navigation
  go_router: ^14.3.0

  # Icons & Fonts
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  lucide_icons: ^0.257.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
